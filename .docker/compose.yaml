# Docker development environment for iTop
# See README.md in this folder for usage. Settings come from .docker/.env (see .env.dist).
name: itop

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-itop}
      MARIADB_USER: ${MARIADB_USER:-itop}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .docker/.env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .docker/.env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=64M
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: itop-web:dev
    restart: unless-stopped
    # Used by render-setup-params.php. Interpolated (not env_file) so that the values always match
    # the ones given to the db service and to the port mapping, even when overridden by the shell.
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-itop}
      MARIADB_USER: ${MARIADB_USER:-itop}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .docker/.env}
      HTTP_PORT: ${HTTP_PORT:-8080}
      ITOP_ADMIN_LOGIN: ${ITOP_ADMIN_LOGIN:-admin}
      ITOP_ADMIN_PASSWORD: ${ITOP_ADMIN_PASSWORD:-}
      ITOP_LANGUAGE: ${ITOP_LANGUAGE:-EN US}
      ITOP_SAMPLE_DATA: ${ITOP_SAMPLE_DATA:-1}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Only reachable from this computer by default: set HTTP_BIND_ADDRESS=0.0.0.0 to expose it on the network
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      # The repository root is the web root
      - ..:/var/www/html

volumes:
  db-data:
